<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de comida de La Mesa">
  <title>La Mesa · Catálogo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="index.html">La Mesa<span>COMIDA HECHA CON GANAS</span></a>
    <span class="fase">Fase 1 · Catálogo</span>
  </header>

  <main>
    <section class="presentacion" aria-labelledby="titulo-catalogo">
      <p class="etiqueta">FRESCO, SENCILLO Y DELICIOSO</p>
      <h1 id="titulo-catalogo">¿Qué se te antoja hoy?</h1>
      <p>Explora nuestro menú y encuentra tu próximo plato favorito.</p>
    </section>

    <section class="controles" aria-label="Filtros del catálogo">
      <div class="campo">
        <label for="busqueda">Buscar</label>
        <input id="busqueda" type="search" placeholder="Nombre o descripción" autocomplete="off">
      </div>
      <div class="campo">
        <label for="categoria">Categoría</label>
        <select id="categoria">
          <option value="todas">Todas las categorías</option>
        </select>
      </div>
      <button id="limpiar" type="button">Limpiar filtros</button>
    </section>

    <p id="resumen" class="resumen" role="status" aria-live="polite"></p>
    <section id="catalogo" class="catalogo" aria-label="Platos disponibles"></section>
    <p id="sin-resultados" class="sin-resultados" hidden>No encontramos platos con esos filtros.</p>
  </main>

  <footer>La Mesa · Proyecto académico de pedidos de comida</footer>
</body>
</html>
